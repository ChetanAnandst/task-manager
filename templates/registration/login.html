{% extends "base.html" %}
{% block title %}Sign in — Taskboard{% endblock %}
{% block content %}
<section class="form-page">
  <div class="form-card auth-card">
    <p class="eyebrow">Welcome back</p>
    <h1>Sign in</h1>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      {% if form.non_field_errors %}<div class="field-error">{{ form.non_field_errors }}</div>{% endif %}
      <button class="button button-full" type="submit">Sign in</button>
    </form>
    <p class="auth-link">New here? <a href="/accounts/signup">Create an account</a></p>
  </div>
</section>
{% endblock %}
