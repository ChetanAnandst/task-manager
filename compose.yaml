services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SECRET_KEY: "local-development-only-change-me"
      DATABASE_PATH: "/app/data/tasks.sqlite3"
    volumes:
      - task-data:/app/data
    restart: unless-stopped

volumes:
  task-data:
